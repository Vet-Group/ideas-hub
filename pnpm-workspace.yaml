packages:
  - apps/*
  - packages/*
  - packages/sources/*
  - spikes/*
  - deploy/cloudflare/*
# Exact versions only (ADR 0001 pins every dependency).
saveExact: true
# Prebuilt binaries come as optional platform packages; their install scripts only re-check them.
allowBuilds:
  esbuild: false
  sharp: false
minimumReleaseAgeExclude:
  - '@next/env@16.4.3'
  - '@next/swc-darwin-arm64@16.4.3'
  - '@next/swc-darwin-x64@16.4.3'
  - '@next/swc-linux-arm64-gnu@16.4.3'
  - '@next/swc-linux-arm64-musl@16.4.3'
  - '@next/swc-linux-x64-gnu@16.4.3'
  - '@next/swc-linux-x64-musl@16.4.3'
  - '@next/swc-win32-arm64-msvc@16.4.3'
  - '@next/swc-win32-x64-msvc@16.4.3'
  - next@16.4.3
