# Local services for Ideas Hub development. Ports avoid 3100, 20128, 1933, 11434, 8642 and 40325,
# which other apps use on the dev machine (ADR 0001). Credentials are local-only placeholders.
name: ideas-hub

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    # Caps for the shared production host (phase 2 plan Step 2a); rootless Docker needs the cpu
    # controller delegated to the user's manager for `cpus`.
    mem_limit: 1g
    cpus: 1.0
    environment:
      POSTGRES_USER: ideashub
      POSTGRES_PASSWORD: ideashub-local-only
      POSTGRES_DB: ideashub
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ideashub -d ideashub"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio:
    # The official minio/minio image is no longer publicly pullable; this is the Chainguard rebuild
    # of the same server, pinned by digest (the one POD Studio uses).
    image: chainguard/minio@sha256:4692462f35d97d7e82c30371d82f057703c5d9489bcae726010594c812f2d285
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ideashub
      MINIO_ROOT_PASSWORD: ideashub-local-only
    ports:
      - "127.0.0.1:9300:9000"
      - "127.0.0.1:9301:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pg-data:
  minio-data:
