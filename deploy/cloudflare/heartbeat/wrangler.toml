# External heartbeat for Ideas Hub: see "External heartbeat" in docs/ops/production.md.
# Deploy from this directory: `npx wrangler deploy` (not run by CI).
name = "ideas-hub-heartbeat"
main = "src/index.ts"
compatibility_date = "2025-09-01"
workers_dev = false

[triggers]
crons = ["*/5 * * * *"]

[vars]
HEALTH_URL = "https://ideas.vetgroup.net/api/health"

# KV namespace "ideas-hub-heartbeat-HEARTBEAT", created 2026-10-23.
[[kv_namespaces]]
binding = "HEARTBEAT"
id = "db1110bf96ba4770a0466135db0832f1"

# Secrets (never in this file): `npx wrangler secret put LARK_WEBHOOK_URL` and, when the bot signs,
# `npx wrangler secret put LARK_WEBHOOK_SECRET`.
