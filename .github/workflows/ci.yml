name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Typecheck, lint, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      # Matches docker-compose.yml, so DATABASE_URL is the one in .env.example.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ideashub
          POSTGRES_PASSWORD: ideashub-local-only
          POSTGRES_DB: ideashub
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U ideashub -d ideashub"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      DATABASE_URL: postgres://ideashub:ideashub-local-only@127.0.0.1:5433/ideashub
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (version from packageManager)

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Schema and migrations agree
        run: pnpm db:generate && git diff --exit-code && test -z "$(git status --porcelain packages/db/migrations)"

      - name: Migrate
        run: pnpm db:migrate

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Lint
        run: pnpm -r lint

      - name: Test
        run: pnpm -r test
