name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Typecheck, lint, test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      # Matches docker-compose.yml, so DATABASE_URL is the one in .env.example.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ideashub
          POSTGRES_PASSWORD: ideashub-local-only
          POSTGRES_DB: ideashub
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U ideashub -d ideashub"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      DATABASE_URL: postgres://ideashub:ideashub-local-only@127.0.0.1:5433/ideashub
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (version from packageManager)

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Schema and migrations agree
        run: pnpm db:generate && git diff --exit-code && test -z "$(git status --porcelain packages/db/migrations)"

      - name: Migrate
        run: pnpm db:migrate

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Lint
        run: pnpm -r lint

      - name: Test
        run: pnpm -r test

      # A service container cannot take the `server /data` command, so MinIO (docker-compose.yml's image)
      # starts here, for the e2e thumbnails and uploads.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9300:9000 -e MINIO_ROOT_USER=ideashub -e MINIO_ROOT_PASSWORD=ideashub-local-only \
            chainguard/minio@sha256:4692462f35d97d7e82c30371d82f057703c5d9489bcae726010594c812f2d285 server /data
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:9300/minio/health/ready && exit 0; sleep 1; done
          docker logs minio; exit 1

      # Builds the web app and runs it on port 3310 against its own ih_e2e database, with the runner's
      # Chrome (playwright.config.ts). Screenshots are compared only once the owner approves baselines.
      - name: End-to-end (web)
        run: pnpm --filter @ideas-hub/web e2e
        env:
          S3_ENDPOINT: http://127.0.0.1:9300
          S3_ACCESS_KEY: ideashub
          S3_SECRET_KEY: ideashub-local-only
